  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen selection:bg-emerald-600 selection:text-white font-['Prompt',sans-serif]">
    <script>
      // Fallback for static hosting: If someone uploads the root directory to Cloudflare Pages / static host
      if (typeof window !== 'undefined' && window.location.protocol.startsWith('http')) {
        var h = window.location.hostname;
        var p = window.location.pathname;
        var isDev = h === 'localhost' || h === '127.0.0.1' || h.indexOf('run.app') !== -1;
        if (!isDev && p.indexOf('/dist') === -1) {
          var cleanPath = p.replace(/index\.html$/, '').replace(/\/$/, '');
          window.location.replace(cleanPath + '/dist/');
        }
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
